<!-- templates/catalog/list.html (фрагмент) -->
<form method="get" class="filters">
  {{ filter.form.q }}
  {{ filter.form.category }}
  {{ filter.form.price_max }}
  <button type="submit">Найти</button>
</form>

<div class="grid">
  {% for item in page %}
    <div class="card">
      {% if item.photo %}<img src="{{ item.photo.url }}" alt="{{ item.name }}">{% endif %}
      <h3>{{ item.name }}</h3>
      <p>{{ item.tariff.day_price }} ₽/сутки</p>
      <a href="{% url 'create_booking' item.pk %}">Забронировать</a>
    </div>
  {% endfor %}
</div>
